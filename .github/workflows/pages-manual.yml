name: Deploy marketing site (manual approval)

on:
  workflow_dispatch:
    inputs:
      approved_by_orlando:
        description: 'Nombre de Orlando confirmando la aprobación'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.approved_by_orlando != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@balo/marketing
      - name: Prepare Pages artifact and preserve legacy URLs
        run: |
          cp -R apps/marketing/dist site
          cp -R outputs site/outputs
          cp -R public site/public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
